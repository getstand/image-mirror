name: Sync

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - images.txt
      - bin/sync
      - .github/workflows/sync.yml

permissions:
  contents: write # images.lock
  packages: write

concurrency:
  group: sync
  cancel-in-progress: false

env:
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install crane
        run: |
          curl -sSfL -o crane.tgz \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  crane.tgz" | sha256sum -c -
          sudo tar -C /usr/local/bin -xzf crane.tgz crane
          rm crane.tgz
          crane version

      - name: Log in to ghcr.io
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: crane auth login ghcr.io -u "${{ github.actor }}" --password-stdin <<< "$GITHUB_TOKEN"

      - name: Sync images
        run: bin/sync

      # The commit is also what keeps the schedule alive: GitHub disables
      # scheduled workflows on a public repo after 60 days without a commit.
      - name: Record what the mirror serves
        run: |
          git add images.lock
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions[bot] \
              -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
              commit -m "sync: $(date -u +%Y-%m-%d)"
          git push
